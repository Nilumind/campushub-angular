<div class="flex min-h-screen">
  <!-- Left Side: Image -->
  <div class="left-side-container bg-cover bg-center relative" style="background-image: url('images/Untitled design (7).png');">
    <div class="absolute inset-0 bg-white" style="opacity: 0.4;"></div>

    <!-- Logo in the middle -->
    <img src="images/Campushub (4).png" alt="Logo" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-99" />
  </div>

  <!-- Right Side: Form -->
  <div class="flex-1 flex justify-center items-center bg-cover bg-center relative" style="background-image: url('images/Untitled design (8).png');">
    
    <div class="absolute inset-0" style="background-color: rgb(47, 70, 139);opacity: 0.9;"></div>

    <div class="relative z-10 bg-white shadow-xl rounded-xl p-8 w-full max-w-md">
      <h2 class="text-3xl font-bold text-center text-gray-800 mb-6">Login</h2>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
        <!-- Email -->
        <div>
          <label class="block text-gray-700 font-semibold">Email</label>
          <input 
              type="email" 
              formControlName="email" 
              placeholder="example@university.edu"
              class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
              [ngClass]="{'border-red-500': loginForm.get('email')?.invalid && loginForm.get('email')?.touched}"
          />
          <p *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" 
             class="text-red-500 text-sm mt-1">Valid Email is required.</p>
        </div>

        <!-- Password -->
        <div>
          <label class="block text-gray-700 font-semibold">Password</label>
          <input 
              type="password" 
              formControlName="password" 
              placeholder="••••••••"
              class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
          />
          <p *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" 
             class="text-red-500 text-sm mt-1">Password is required.</p>
        </div>

        <!-- Submit Button -->
        <button 
            type="submit" 
            class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700 transition-all"
            [disabled]="loginForm.invalid"
        >
            Login
        </button>
      </form>

      <!-- Forgot Password Link -->
      <div class="mt-4 text-center">
        <a href="/forgot-password" class="text-blue-500 hover:text-blue-700 text-sm">
          Forgot your password?
        </a>
      </div>
    </div>
  </div>
</div>
