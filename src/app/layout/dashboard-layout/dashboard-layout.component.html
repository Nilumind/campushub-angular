<!-- dashboard-layout.component.html -->
<div class="flex h-screen bg-gray-100">
  <!-- Sidebar -->
  <aside class="w-64 bg-white shadow-md flex flex-col">
    <div class="text-xl font-bold border-b" style="padding: 9.8px;"> <img src="images/Campushub (4).png" alt="SCMS Logo" class="w-auto inline-block mr-4" /></div>
    <nav class="flex-1 p-4">
      <ul class="space-y-2">
        <li class="p-2 rounded hover:bg-gray-200 cursor-pointer" [routerLink]="'/dashboard'">🏠 Dashboard</li>
        <li class="p-2 rounded hover:bg-gray-200 cursor-pointer" [routerLink]="'/shedule'">📅 Schedule</li>
        <li class="p-2 rounded hover:bg-gray-200 cursor-pointer" [routerLink]="'/reservations'">🏫 Reservations</li> 
        <li class="p-2 rounded hover:bg-gray-200 cursor-pointer" [routerLink]="'/profile'">👤 Profile</li>
        <li class="p-2 rounded hover:bg-gray-200 cursor-pointer" [routerLink]="'/settings'">⚙️ Settings</li>
      </ul>
    </nav>
  </aside>

  <!-- Main Content -->
  <div class="flex-1 flex flex-col">
    <!-- Navbar -->
    <header class="bg-white shadow-md p-4 flex justify-between items-center">
      <input type="text" placeholder="Search..." class="border rounded p-2 w-1/3">
      <div class="flex items-center space-x-4">
        <span class="cursor-pointer">🔔</span>
        <span class="cursor-pointer">👤 Profile</span>
      </div>
    </header>

    <!-- Dashboard Content -->
    <main class="p-6 flex-1">
      <router-outlet></router-outlet> <!-- Child components like Schedule will be displayed here -->
    </main>
  </div>
</div>
