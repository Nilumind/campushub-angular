<!-- reservation.component.html -->
<div class="reservation-container">
    <h2>Reservation Requests</h2>
    <table mat-table [dataSource]="eventsData" class="mat-elevation-z8">
        <ng-container matColumnDef="eventName">
          <th mat-header-cell *matHeaderCellDef>Event Name</th>
          <td mat-cell *matCellDef="let element">{{ element.eventName }}</td>
        </ng-container>
        <ng-container matColumnDef="eventType">
          <th mat-header-cell *matHeaderCellDef>Event Type</th>
          <td mat-cell *matCellDef="let element">{{ element.eventType }}</td>
        </ng-container>
        <ng-container matColumnDef="dateAndTime">
          <th mat-header-cell *matHeaderCellDef style="padding-left: 48px;">Date & Time</th>
          <td mat-cell *matCellDef="let element">{{ element.dateAndTime }}</td>
        </ng-container>
        <ng-container matColumnDef="place">
          <th mat-header-cell *matHeaderCellDef>Place</th>
          <td mat-cell *matCellDef="let element">{{ element.place }}</td>
        </ng-container>
        <ng-container matColumnDef="equipments">
            <th mat-header-cell *matHeaderCellDef>Equipments</th>
            <td mat-cell *matCellDef="let element">{{ element.equipments }}</td>
          </ng-container>
        <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef style="padding-left: 55px;">Actions</th>
          <td mat-cell *matCellDef="let element">
            <button mat-button (click)="approveReservation(eventsData)">Approve</button>
            <button mat-button (click)="rejectReservation(eventsData)">Reject</button>
          </td>
        </ng-container>
  
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
  
  </div>
