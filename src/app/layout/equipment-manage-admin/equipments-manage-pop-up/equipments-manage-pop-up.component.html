<mat-dialog-content class="dialog-container">
    <div class="dialog-header">
      <h2 class="dialog-title">Manage Equipment</h2>
      <button mat-icon-button class="close-button" (click)="closeDialog()">
        <mat-icon>close</mat-icon>
      </button>
    </div>
  
    <form (ngSubmit)="addEquipment()">
      <div class="form-row">
        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Equipment Name</mat-label>
          <input matInput [(ngModel)]="newEquipment.name" name="name" required />
        </mat-form-field>
  
        <mat-form-field appearance="fill" class="half-width">
          <mat-label>Quantity</mat-label>
          <input matInput [(ngModel)]="newEquipment.quantity" name="quantity" type="number" required />
        </mat-form-field>
  
        <button mat-icon-button color="primary" type="submit">
          <mat-icon>add</mat-icon>
        </button>
      </div>
    </form>
  
    <!-- Equipment List -->
    <div *ngIf="equipmentList.length > 0">
      <table mat-table [dataSource]="equipmentList" class="equipment-table">
        
        <!-- Name Column -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef> Name </th>
          <td mat-cell *matCellDef="let item">
            <input matInput [(ngModel)]="item.name" *ngIf="item.isEditing" />
            <span *ngIf="!item.isEditing">{{ item.name }}</span>
          </td>
        </ng-container>
  
        <!-- Quantity Column -->
        <ng-container matColumnDef="quantity">
          <th mat-header-cell *matHeaderCellDef> Quantity </th>
          <td mat-cell *matCellDef="let item">
            <input matInput type="number" [(ngModel)]="item.quantity" *ngIf="item.isEditing" />
            <span *ngIf="!item.isEditing">{{ item.quantity }}</span>
          </td>
        </ng-container>
  
        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef> Actions </th>
          <td mat-cell *matCellDef="let item">
            <button mat-icon-button color="primary" (click)="editEquipment(item)" *ngIf="!item.isEditing">
              <mat-icon>edit</mat-icon>
            </button>
  
            <button mat-icon-button color="accent" (click)="saveEquipment(item)" *ngIf="item.isEditing">
              <mat-icon>save</mat-icon>
            </button>
  
            <button mat-icon-button color="warn" (click)="deleteEquipment(item)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>
  
        <tr mat-header-row *matHeaderRowDef="['name', 'quantity', 'actions']"></tr>
        <tr mat-row *matRowDef="let row; columns: ['name', 'quantity', 'actions'];"></tr>
      </table>
    </div>
  
    <div *ngIf="equipmentList.length === 0" class="empty-state">
      No equipment added yet.
    </div>
  
    <div class="button-container">
      <button mat-button color="primary" (click)="saveAllChanges()">Save Changes</button>
      <button mat-button color="warn" (click)="closeDialog()">Close</button>
    </div>
  </mat-dialog-content>
