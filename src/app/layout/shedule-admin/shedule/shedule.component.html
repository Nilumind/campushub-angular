<div class="event-dashboard">
  <!-- Calendar or Date Picker -->
  <div class="calendar">
    <h3>Event Schedule</h3>
    <!-- You can integrate angular-calendar or any date picker here -->
  </div>

  <!-- Events List -->
  <div class="event-list">
    <h3>Upcoming Events</h3>
    <table mat-table [dataSource]="eventsData" class="mat-elevation-z8">
      <ng-container matColumnDef="eventName">
        <th mat-header-cell *matHeaderCellDef>Event Name</th>
        <td mat-cell *matCellDef="let element">{{ element.eventName }}</td>
      </ng-container>
      <ng-container matColumnDef="eventType">
        <th mat-header-cell *matHeaderCellDef>Event Type</th>
        <td mat-cell *matCellDef="let element">{{ element.eventType }}</td>
      </ng-container>
      <ng-container matColumnDef="eventDate">
        <th mat-header-cell *matHeaderCellDef>Date</th>
        <td mat-cell *matCellDef="let element">{{ element.eventDate | date: 'short' }}</td>
      </ng-container>
      <ng-container matColumnDef="place">
        <th mat-header-cell *matHeaderCellDef>Place</th>
        <td mat-cell *matCellDef="let element">{{ element.place }}</td>
      </ng-container>
      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let element">
          <button mat-button (click)="onEditEvent(element)">Edit</button>
          <button mat-button (click)="onDeleteEvent(element)">Delete</button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>

  <!-- Schedule New Event Button -->
  <button mat-raised-button color="primary" (click)="openEventForm()">Schedule New Event</button>
</div>
