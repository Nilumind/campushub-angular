  <mat-card class="event-list-card">
    <mat-card-title>Reservation status</mat-card-title>
    <mat-card-content>
      <table mat-table [dataSource]="eventsData" class="mat-elevation-z8 full-width">

        <!-- Event Name Column -->
        <ng-container matColumnDef="eventName">
          <th mat-header-cell *matHeaderCellDef>Event Name</th>
          <td mat-cell *matCellDef="let element">{{ element.eventName }}</td>
        </ng-container>

        <!-- Event Type Column -->
        <ng-container matColumnDef="eventType">
          <th mat-header-cell *matHeaderCellDef>Event Type</th>
          <td mat-cell *matCellDef="let element">{{ element.eventType }}</td>
        </ng-container>

        <!-- Event Date Column -->
        <ng-container matColumnDef="eventDate">
          <th mat-header-cell *matHeaderCellDef style="padding-left: 48px;">Date & Time</th>
          <td mat-cell *matCellDef="let element">{{ element.eventDate }}</td>
        </ng-container>

        <!-- Place Column -->
        <ng-container matColumnDef="place">
          <th mat-header-cell *matHeaderCellDef>Place</th>
          <td mat-cell *matCellDef="let element">{{ element.place }}</td>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let element">
            <button mat-icon-button color="accent" (click)="onEditEvent(element)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="onDeleteEvent(element)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef style="padding-left: 55px;">Status</th>
          <td mat-cell *matCellDef="let element" [ngClass]="getStatusClass(element.status)" style="padding-left: 50px;">{{ element.status }}</td>
        </ng-container>

        <!-- Table Rows -->
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </mat-card-content>
  </mat-card>
</div>
